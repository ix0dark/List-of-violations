<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لائحة المخالفات</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header-actions">
        <button class="reset-btn" onclick="resetDatabase()">إعادة ضبط النصوص للافتراضي</button>
    </div>

    <div class="dashboard">
        <!-- عمود المخالفات العالية -->
        <div class="column">
            <h3 class="title-high">
                <span class="dot dot-high"></span>
                مخالفات عالية
            </h3>
            <ul class="violation-list" id="list-high"></ul>
        </div>

        <!-- عمود المخالفات المتوسطة -->
        <div class="column">
            <h3 class="title-medium">
                <span class="dot dot-medium"></span>
                مخالفات متوسطة
            </h3>
            <ul class="violation-list" id="list-medium"></ul>
        </div>

        <!-- عمود المخالفات المنخفضة -->
        <div class="column">
            <h3 class="title-low">
                <span class="dot dot-low"></span>
                مخالفات منخفضة
            </h3>
            <ul class="violation-list" id="list-low"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
